name: build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.adoc'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'TODO.impl/**'
      - 'benchmark/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    uses: metanorma/ci/.github/workflows/prepare-rake.yml@main

  test:
    name: Test on Ruby ${{ matrix.ruby-version }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    if: needs.prepare.outputs.push-for-tag != 'true'
    # nokogiri (benchmark group only) source-builds on aarch64-Windows
    # and dies on an expired mirror cert — the suite never requires it.
    env:
      BUNDLE_WITHOUT: benchmark
      # leptris/leptris#1242: the fix shipped in 1.9.208 did NOT
      # cure the all-nil iterparse reads on this leg (strike 7,
      # identical signature). The engine's miss discriminator dumps
      # attribute-chain state on lookup misses — armed here to
      # capture it on the next strike.
      LEPTRIS_DEBUG_ATTR_MISS: ${{ matrix.ruby-version == '3.4' && matrix.os == 'ubuntu-latest' && '1' || '' }}

    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      max-parallel: 5
      # The FULL platform/ruby grid, owned in-repo (the shared
      # metanorma prepare matrix only covered the 3x3
      # ubuntu/macos/windows core). Every platform the release
      # SHIPS gets its suite RUN here, not just built: x86_64 +
      # aarch64 linux, arm64 + intel darwin, x64 + arm64 Windows.
      # Ruby 3.3 is unavailable on windows-11-arm.
      matrix:
        ruby-version: ['3.3', '3.4', '4.0']
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest,
             macos-15-intel, windows-latest, windows-11-arm]
        experimental: [false]
        exclude:
          # Ruby 3.3 is unavailable on the windows-arm runner
          - os: windows-11-arm
            ruby-version: '3.3'

    steps:
    - uses: actions/checkout@v4

    - uses: ruby/setup-ruby@master
      with:
        bundler-cache: true
        ruby-version: ${{ matrix.ruby-version }}

    # rake compile vendors libleptris (Rakefile LIBLEPTRIS_VERSION pin)
    # into lib/ where the FFI search order finds it -- no env var needed.
    # The symbol audit gates the suite: attached == exported on the
    # vendored library, so upstream surface drift fails here first.
    - run: bundle exec rake compile audit:symbols
    - run: bundle exec rspec

  test-musl:
    # The musl platform gems were BUILT in Alpine but the suite never
    # ran on musl — libelf/linking/allocator behavior differs from
    # glibc (the engine's own history: #1166). Same container shape
    # as the release's build-musl, plus rspec inside.
    name: Test on Ruby 3.3 alpine (musl)
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.push-for-tag != 'true'
    env:
      BUNDLE_WITHOUT: benchmark
    steps:
      - uses: actions/checkout@v4

      - name: Compile + suite in Alpine container
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e BUNDLE_WITHOUT=benchmark \
            ruby:3.3-alpine sh -c '
              set -eux
              apk add --no-cache build-base bash curl git cmake make
              git config --global --add safe.directory /work
              bundle install --jobs 4 --retry 3
              bundle exec rake compile audit:symbols
              bundle exec rspec
            '

  test-qemu:
    # POWER8+ LE and IBM Z: no native runners — the full suite runs
    # under qemu binfmt. ppc64le uses the official ruby image;
    # s390x uses Debian's distro ruby 3.1 (the official ruby images
    # dropped s390x manifests; 3.1 >= our 3.0 floor). Both went
    # strict at 1.9.208: the big-endian close-tag bug (#1197) was
    # fixed engine-side in 1.9.206 and both legs ran green on
    # main's 1.9.207 grid.
    name: Test ${{ matrix.arch }} (qemu)
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.push-for-tag != 'true'
    continue-on-error: ${{ matrix.experimental }}
    env:
      BUNDLE_WITHOUT: benchmark
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ppc64le-linux
            qplatform: linux/ppc64le
            image: ruby:3.3-bookworm
            ruby: image-ruby
            experimental: false
          # official ruby images dropped s390x entirely; Alpine still
          # ships ruby 3.3 for s390x as a release arch
          - arch: s390x-linux
            qplatform: linux/s390x
            image: alpine:3.20
            ruby: alpine-ruby
            experimental: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: Compile + suite in emulated container
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --platform '${{ matrix.qplatform }}' \
            -v "$PWD:/work" \
            -w /work \
            -e BUNDLE_WITHOUT=benchmark \
            "${IMAGE}" sh -c '
              set -eux
              if [ "${{ matrix.ruby }}" = "alpine-ruby" ]; then
                apk add --no-cache ruby ruby-dev build-base cmake bash curl git linux-headers
                gem install bundler --no-document
              else
                apt-get update -qq
                apt-get install -y -qq build-essential cmake bash git curl
                if [ "${{ matrix.ruby }}" = "distro-ruby" ]; then
                  apt-get install -y -qq ruby ruby-dev
                  gem install bundler --no-document
                fi
              fi
              git config --global --add safe.directory /work
              bundle install --jobs 4 --retry 3
              bundle exec rake compile audit:symbols
              bundle exec rspec
            '

  source-install:
    # Packaging doctrine proof: the ruby-platform gem is an sdist —
    # MRI compiles libleptris + the native layer from the vendored
    # sources at install; TruffleRuby (no mkmf) installs through
    # the guarded no-op and runs the vendored binaries via FFI.
    name: Source install on ${{ matrix.ruby-version }}
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.push-for-tag != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby-version: '3.3'
            expect: native
          # TruffleRuby builds C exts natively these days — a full
          # source install; JRuby is the true no-mkmf engine and
          # must ride the vendored-binary FFI path.
          - ruby-version: truffleruby
            expect: native
          - ruby-version: jruby
            expect: ffi
    steps:
      - uses: actions/checkout@v4

      # JRuby 10 needs Java 21; runners default to 17
      # (UnsupportedClassVersionError otherwise).
      - uses: actions/setup-java@v4
        if: matrix.ruby-version == 'jruby'
        with:
          distribution: temurin
          java-version: '21'

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: false

      - run: bundle install --jobs 4 --retry 3
        env:
          BUNDLE_WITHOUT: benchmark

      - run: bundle exec rake compile
        env:
          BUNDLE_WITHOUT: benchmark

      - name: Stage vendored binaries (the no-mkmf install path)
        run: |
          mkdir -p lib/leptris/vendor/x86_64-linux
          cp lib/libleptris.so lib/leptris/vendor/x86_64-linux/ 2>/dev/null || true
          cp lib/libutf8proc.so* lib/leptris/vendor/x86_64-linux/ 2>/dev/null || true

      - run: bundle exec rake platform:any gem
        env:
          BUNDLE_WITHOUT: benchmark

      - name: Install from the built source gem and round-trip it
        run: |
          gem install --local pkg/leptris-*.gem --no-document
          # Capture regardless of the smoke's exit code — bash -e
          # would swallow the failure output before it can be read.
          out=$(ruby scripts/gem_smoke.rb 2>&1) || rc=$?
          echo "$out"
          if [ -n "${rc:-}" ]; then exit "$rc"; fi
          case "${{ matrix.expect }}" in
            native) echo "$out" | grep -q "SMOKE OK (native layer)" ;;
            ffi)    echo "$out" | grep -q "SMOKE OK (ffi layer)" ;;
          esac
