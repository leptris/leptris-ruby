name: build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.adoc'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'TODO.impl/**'
      - 'benchmark/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    uses: metanorma/ci/.github/workflows/prepare-rake.yml@main

  test:
    name: Test on Ruby ${{ matrix.ruby.version }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    if: needs.prepare.outputs.push-for-tag != 'true'

    continue-on-error: ${{ matrix.ruby.experimental }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4

    - name: Install libtaurus from source
      shell: bash
      run: |
        set -e
        mkdir -p /tmp/tb && cd /tmp/tb
        curl -sL https://api.github.com/repos/lutaml/taurus/tarball/v0.26.4 | tar xz --strip-components=1
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DTAURUS_BUILD_SHARED=ON \
          -DTAURUS_BUILD_STATIC=OFF \
          -DBUILD_TESTING=OFF \
          -DTAURUS_BUILD_CLI=OFF \
          -DTAURUS_BUILD_BENCHMARKS=OFF \
          -DTAURUS_BUILD_MAN_PAGES=OFF \
          -DTAURUS_ENABLE_UTF8PROC=OFF \
          -DTAURUS_ENABLE_ICONV=OFF
        cmake --build build --config Release -j 4
        LIB=$(find build -type f -o -type l 2>/dev/null | grep -iE '(lib)?taurus\.(dylib|so|dll)$' | head -1)
        if [ -z "$LIB" ]; then
          echo "ERROR: libtaurus shared library not found after build"
          find build -name '*taurus*' -type f
          exit 1
        fi
        LIBPATH=$(cygpath -w "$(pwd)/$LIB" 2>/dev/null || echo "$(pwd)/$LIB")
        echo "TAURUS_LIB_PATH=$LIBPATH" >> "$GITHUB_ENV"
        echo "Installed libtaurus at: $LIBPATH"

    - uses: ruby/setup-ruby@master
      with:
        bundler-cache: true
        ruby-version: ${{ matrix.ruby.version }}
        rubygems: ${{ matrix.ruby.rubygems }}

    - run: bundle exec rake
