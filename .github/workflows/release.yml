name: release

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: 'Version to release (e.g. 1.1.1). Leave empty to use current VERSION.'
        type: string
        required: false
  # Auto-release: a version bump landing on main (the engine-sync
  # ride PR merge) IS the release decision — ship it. The bump job
  # skips (version already on main); build + publish check out
  # main's head via the existing `|| github.ref` fallbacks.
  push:
    branches: [main]
    paths: ['lib/leptris/version.rb']

# ONE release at a time, GLOBALLY — the metanorma/ci rubygems-release
# discipline (lutaml-model's release.yml): a single 'release' group so
# a dispatch and a push-triggered run serialize against each other
# (interpolated groups would let them race in parallel), and
# cancel-in-progress: false so a duplicate QUEUES behind an in-flight
# publish instead of killing it — half-published gems are worse than a
# queued release. Bit us on the 1.9.359 train: a duplicate dispatch
# cancelled the original run mid-release, stranding the publication
# (RubyGems stayed on 1.9.356 through v1.9.357-359). The publish loop
# is idempotent, so a queued duplicate is always safe.
concurrency:
  group: release
  cancel-in-progress: false

# contents: write is needed for pushing the version-bump commit + tag.
# id-token: write is required for RubyGems.org Trusted Publishing (OIDC).
permissions:
  contents: write
  id-token: write

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch' && inputs.next_version != ''
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'

      - name: Bump version.rb
        id: bump
        shell: bash
        env:
          NEXT_VERSION: ${{ inputs.next_version }}
        run: |
          set -euo pipefail
          # Accept x.y.z and x.y.z.w (the lockstep scheme
          # {libleptris-semver}.{binding-patch}), or a relative bump
          # (major/minor/patch) computed from the CURRENT version —
          # patch bumps the BINDING segment (the fourth). The guard
          # exists because a non-semver input once produced VERSION
          # = "patch" on main and a junk tag literally named "v".
          INPUT="${NEXT_VERSION}"
          if [[ "$INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            :
          elif [[ "$INPUT" == "major" || "$INPUT" == "minor" || "$INPUT" == "patch" ]]; then
            CURRENT=$(ruby -Ilib -rleptris/version -e 'puts Leptris::VERSION')
            IFS=. read -r MA MI PA QU <<< "$CURRENT"
            QU="${QU:-0}"
            case "$INPUT" in
              major) MA=$((MA + 1)); MI=0; PA=0; QU=0 ;;
              minor) MI=$((MI + 1)); PA=0; QU=0 ;;
              patch) QU=$((QU + 1)) ;;
            esac
            INPUT="${MA}.${MI}.${PA}.${QU}"
          else
            echo "::error::next_version must be x.y.z or major/minor/patch, got '${INPUT}'"
            exit 1
          fi
          echo "Releasing ${INPUT}"
          sed -i "s/VERSION = \".*\"/VERSION = \"${INPUT}\"/" lib/leptris/version.rb
          NEW_VERSION=$(ruby -Ilib -rleptris/version -e 'puts Leptris::VERSION')
          # Emit the output the push step consumes. Without it the
          # tag push received an empty version and created tag "v".
          echo "new-version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/leptris/version.rb
          # Idempotent: re-releasing the current version must not
          # fail on an empty commit.
          if git diff --cached --quiet; then
            echo "No version change; tagging current HEAD."
          else
            git commit -m "Bump leptris to ${NEW_VERSION}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push the release branch + tag (main is protected — ruby#645 follow-up)
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new-version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # main is a protected branch and the workflow token cannot
          # push it (the 1.9.426.1 dispatch died on GH006). The
          # release now rides its own branch: the tag and every build
          # leg pin THIS branch's sha, and the version bump reaches
          # main through the PR opened below (merged in the
          # post-release pass — future dispatches pass explicit
          # versions, so main's version.rb lagging is harmless).
          BRANCH="release/v${NEW_VERSION}"
          git push origin "+HEAD:refs/heads/${BRANCH}"
          git tag "v${NEW_VERSION}" HEAD
          # A failed release run can leave its tag behind while the
          # gems never published; re-dispatching the same version
          # must not die on it (the publish loop is idempotent).
          git push origin "v${NEW_VERSION}" || \
            echo "::warning::tag v${NEW_VERSION} already exists — continuing"
          gh pr create --base main --head "${BRANCH}" \
            --title "Bump leptris to ${NEW_VERSION}" \
            --body "Post-release version bump (main is protected — the release rides the branch; merge to keep main's version.rb current)." || \
            echo "::warning::bump PR for ${BRANCH} already exists — continuing"

  # Snapshot main's HEAD once — every build leg checks out THIS
  # sha. Without it the slow legs (docker qemu, musl) checkout
  # github.ref at their own start time and a push landing mid-run
  # ships half the release from one commit and half from another
  # (the 1.9.363.0 train: the parity gate caught element.rb skew
  # between the musl and ruby variants).
  pin:
    needs: bump
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.snapshot.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || needs.pin.outputs.sha }}
      - id: snapshot
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: [bump, pin]
    if: always() && !cancelled() && !failure()
    runs-on: ${{ matrix.os }}
    # Release builds never run the benchmark suite; nokogiri has no
    # aarch64-Windows binary gem and its source build fails there.
    env:
      BUNDLE_WITHOUT: benchmark
    strategy:
      fail-fast: false
      matrix:
        include:
          # leptris-ruby#2109 stage 2: the gnu floor leg builds in
          # docker containers using the IMAGE's own ruby — built FOR
          # bullseye's glibc 2.31, so every shipped artifact binds
          # only 2.31-and-older symbols (the nokogiri /
          # rake-compiler-dock shape). The dead #655 design (job-level
          # container + actions/setup-ruby) cannot work: setup-ruby
          # installs ubuntu-built ruby binaries that require GLIBC
          # 2.34 and cannot execute inside the container (the 1.9.432
          # publish attempts died at `ruby --version` itself). The
          # host never runs a ruby against this leg's build steps —
          # it only orchestrates docker, the gate, and gem packaging
          # (glibc-independent assembly of the container-built
          # artifacts).
          - os: ubuntu-22.04
            platform: x86_64-linux
          - os: windows-latest
            platform: x64-mingw32
          - os: windows-latest
            platform: x64-mingw-ucrt
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
            ruby-version: '3.4'
          # leptris-ruby#506: macos-latest is a FLOATING image — an
          # Apple image update changes Xcode/clang between release
          # builds, and codegen shifts masquerade as ride regressions
          # (the 368.1 vs 369.1 darwin dylibs differed by 924k bytes
          # of code motion on identical source). Pin the image; the
          # pinned image pins the toolchain for the release lifetime.
          - os: macos-15
            platform: arm64-darwin
          - os: macos-15-intel
            platform: x86_64-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || needs.pin.outputs.sha }}

      # ---- leptris-ruby#2109 stage 2: the gnu floor leg ----
      # libleptris.so + libutf8proc (the FFI surface) + the 3.3
      # native bundle + the vendored engine sources: ONE docker run
      # of ruby:3.3-bullseye, whose ruby is built for bullseye's
      # glibc 2.31. The script is a FILE, not a sh -c string (the
      # inline form died on quoting classes — see build-arm32).
      - name: Build the engine library in the bullseye container
        if: matrix.platform == 'x86_64-linux'
        run: |
          mkdir -p .ci-rel
          cat > .ci-rel/gnu_engine.sh <<'EOF'
          set -eux
          # bullseye went EOL (Aug 2026): deb.debian.org froze main
          # at the last point release while the image carries newer
          # security-pool packages (libc6 deb11u14 in the image vs
          # u11 in the main index = "held broken packages" on the
          # first install). Point the suites at archive.debian.org,
          # where they still live - the build-arm32 verified pattern.
          # The cmake toolchain comes from the archived backports
          # suite (3.25.1~bpo11+1 - the engine needs 3.20, bullseye
          # ships 3.18); cmake is a build tool, so its own libc
          # needs never touch the artifact's symbol floor.
          codename="$(. /etc/os-release && echo "${VERSION_CODENAME:-}")"
          if [ "${codename}" = "bullseye" ]; then
            printf "deb http://archive.debian.org/debian bullseye main\ndeb http://archive.debian.org/debian-security bullseye-security main\n" \
              > /etc/apt/sources.list
            rm -f /etc/apt/sources.list.d/*.list
          fi
          apt-get -o Acquire::Check-Valid-Until=false update -qq \
            || apt-get -o Acquire::Check-Valid-Until=false --fix-missing update -qq
          apt-get install -y -qq build-essential bash git curl \
            || apt-get install -y -qq --fix-missing build-essential bash git curl
          if [ "${codename}" = "bullseye" ]; then
            echo "deb http://archive.debian.org/debian bullseye-backports main" \
              > /etc/apt/sources.list.d/bullseye-backports.list
            apt-get -o Acquire::Check-Valid-Until=false update -qq \
              || apt-get -o Acquire::Check-Valid-Until=false --fix-missing update -qq
            apt-get install -y -qq -t bullseye-backports cmake \
              || apt-get install -y -qq -t bullseye-backports --fix-missing cmake \
              || apt-get install -y -qq cmake
          else
            apt-get install -y -qq --no-upgrade cmake \
              || apt-get install -y -qq --no-upgrade --fix-missing cmake
          fi
          cmake --version | head -1
          git config --global --add safe.directory /work
          bundle install --jobs 4 --retry 3
          # PGO stays ON (the default) - parity with the shipped
          # library's trained parse path; the trainer rescue degrades
          # loudly to the single-stage build if it ever breaks.
          bundle exec rake compile
          EOF
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e BUNDLE_WITHOUT="${BUNDLE_WITHOUT}" \
            'ruby:3.3-bullseye' sh /work/.ci-rel/gnu_engine.sh

      # Per-minor native bundles: one container per SUPPORTED_MINORS
      # entry (the repo SSOT), the image's ruby providing the matching
      # headers + ABI. The full (non-slim) bullseye images carry the
      # whole toolchain (gcc/make/strings/git + ruby headers), so no
      # apt dance is needed here, and the bundles skip the engine
      # compile (no cmake) — they dlsym the gated libleptris.so, the
      # same shape the host leg shipped. ruby:4.0-bullseye does not
      # exist (docker-library dropped bullseye for ruby >= 4.0): the
      # 4.0 bundle rides 4.0-bookworm, whose libc versions
      # dlopen/dlsym at GLIBC_2.34 — on a pre-2.34 host that one
      # bundle LoadErrors at require and native_layer falls back to
      # the FFI surface by contract (the engine floor itself,
      # libleptris.so, is bullseye-built and gated <= 2.31 below).
      - name: Build per-minor native bundles in bullseye containers
        if: matrix.platform == 'x86_64-linux'
        run: |
          mkdir -p .ci-rel
          cat > .ci-rel/gnu_per_minor.sh <<'EOF'
          set -eux
          git config --global --add safe.directory /work
          ruby ext/build_native_per_minor.rb
          EOF
          for minor in $(cat SUPPORTED_MINORS); do
            case "${minor}" in
              4.0) image='ruby:4.0-bookworm' ;;
              *)   image="ruby:${minor}-bullseye" ;;
            esac
            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              "${image}" sh /work/.ci-rel/gnu_per_minor.sh
          done

      # The gnu glibc floor gate (#2109) is HARD again: the engine
      # library the containers just built - the exact binary the
      # platform gem ships and the ruby variant vendors - must not
      # bind symbols newer than 2.31. The pthread-merge trio
      # (pthread_once etc.) binds 2.34 whenever the build host libc
      # is newer, and the gem then LoadErrors at first use on every
      # pre-2.34 host.
      - name: Gate the gnu glibc floor at 2.31
        if: matrix.platform == 'x86_64-linux'
        run: |
          set -eu
          max=$(strings lib/libleptris.so | grep -oE 'GLIBC_2\.[0-9]+' | sort -uV | tail -1)
          echo "max glibc symbol version: $max"
          if [ -z "$max" ]; then
            echo "::error::no GLIBC symbol versions found in lib/libleptris.so"
            exit 1
          fi
          minor=${max#GLIBC_2.}
          if [ "$minor" -gt 31 ]; then
            echo "::error::the gnu gem binds $max; the floor is 2.31 (leptris-ruby #2109)"
            exit 1
          fi
          echo "gnu floor gate: OK ($max <= GLIBC_2.31)"

      # #227: Windows native layer as one DLL per Ruby minor. A PE
      # DLL must bind its build Ruby's runtime, so each supported
      # minor compiles its own artifact before packaging. The
      # packaging step's own ruby builds its minor via rake
      # compile, and these steps cover the OTHERS — each version
      # is set up exactly once (re-setup hits an msys64 symlink
      # EEXIST), and a minor unavailable on a runner (3.3 on arm)
      # degrades to the loud FFI fallback for that cell only.
      - uses: ruby/setup-ruby@master
        if: contains(matrix.platform, 'mingw') && (matrix.ruby-version || '3.3') != '3.3'
        with:
          ruby-version: '3.3'
          bundler-cache: false
        continue-on-error: true
      - run: ruby ext/build_windows_native.rb
        if: contains(matrix.platform, 'mingw') && (matrix.ruby-version || '3.3') != '3.3'
        shell: bash
        continue-on-error: true
      - uses: ruby/setup-ruby@master
        if: contains(matrix.platform, 'mingw') && (matrix.ruby-version || '3.3') != '3.4'
        with:
          ruby-version: '3.4'
          bundler-cache: false
        continue-on-error: true
      - run: ruby ext/build_windows_native.rb
        if: contains(matrix.platform, 'mingw') && (matrix.ruby-version || '3.3') != '3.4'
        shell: bash
        continue-on-error: true
      - uses: ruby/setup-ruby@master
        if: contains(matrix.platform, 'mingw') && (matrix.ruby-version || '3.3') != '4.0'
        with:
          ruby-version: '4.0'
          bundler-cache: false
        continue-on-error: true
      - run: ruby ext/build_windows_native.rb
        if: contains(matrix.platform, 'mingw') && (matrix.ruby-version || '3.3') != '4.0'
        shell: bash
        continue-on-error: true
      - name: Verify at least one Windows native DLL built
        if: contains(matrix.platform, 'mingw')
        shell: bash
        run: |
          count=$(ls lib/leptris/xml/native_*.so 2>/dev/null | wc -l)
          if [ "$count" -lt 1 ]; then
            echo "ERROR: no native_<minor>.so built for ${{ matrix.platform }}"
            exit 1
          fi
          echo "Windows native DLLs: $count"
          # native_layer requires the MINOR-SUFFIXED init symbol
          # (native_3_4.so -> Init_native_3_4). A DLL exporting only
          # Init_native silently 127s at require time and degrades the
          # platform to the FFI surface — aarch64-mingw-ucrt 1.9.220
          # shipped exactly that (mkmf's own .def wins on the arm
          # toolchain; x64 gcc auto-exports masked it). Fail the build
          # instead of shipping the degradation. The symbol set is
          # SUPPORTED_MINORS (the SSOT; ruby#645).
          for dll in lib/leptris/xml/native_*.so; do
            for m in $(cat SUPPORTED_MINORS | tr "." "_"); do
              if ! strings "$dll" 2>/dev/null | grep -q "Init_native_${m}"; then
                echo "ERROR: $dll does not export Init_native_${m}"
                exit 1
              fi
            done
          done
          echo "All Windows DLLs export the versioned init symbols"

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: ${{ matrix.ruby-version || '3.3' }}
          bundler-cache: true

      # Per-minor native bundles on darwin (ruby#476): the
      # ext's compiled-in RString layout changed in Ruby 3.2, so a
      # single CI-built bundle segfaults under 3.1 (garbage pointer
      # + length into the engine's text counter). One bundle per
      # supported minor ships — the #207/#227 Windows contract,
      # generalized. Windows builds its own per-minor DLLs in the
      # block above, and x86_64-linux builds its bundles in the
      # bullseye containers above (#2109 stage 2 — a host setup-ruby
      # build would bind the host's glibc, not the floor); these
      # host-side steps cover the darwin legs.
      - uses: ruby/setup-ruby@master
        if: runner.os != 'Windows' && matrix.platform != 'x86_64-linux'
        with:
          ruby-version: '3.1'
          bundler-cache: false
      - run: ruby ext/build_native_per_minor.rb
        if: runner.os != 'Windows' && matrix.platform != 'x86_64-linux'
        shell: bash
      - uses: ruby/setup-ruby@master
        if: runner.os != 'Windows' && matrix.platform != 'x86_64-linux'
        with:
          ruby-version: '3.2'
          bundler-cache: false
      - run: ruby ext/build_native_per_minor.rb
        if: runner.os != 'Windows' && matrix.platform != 'x86_64-linux'
        shell: bash
      - uses: ruby/setup-ruby@master
        if: runner.os != 'Windows' && matrix.platform != 'x86_64-linux'
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - run: ruby ext/build_native_per_minor.rb
        if: runner.os != 'Windows' && matrix.platform != 'x86_64-linux'
        shell: bash
      - uses: ruby/setup-ruby@master
        if: runner.os != 'Windows' && matrix.platform != 'x86_64-linux'
        with:
          ruby-version: '3.4'
          bundler-cache: false
      - run: ruby ext/build_native_per_minor.rb
        if: runner.os != 'Windows' && matrix.platform != 'x86_64-linux'
        shell: bash
      # leptris-ruby#554: Ruby 4.0 joins the prebuilt matrix — same
      # per-minor contract (the ext reads RString layout, which 4.0
      # changed again). The builder compiles clean under 4.0 (verified
      # on the issue); without the bundle 4.0 silently falls back to
      # the FFI surface.
      - uses: ruby/setup-ruby@master
        if: runner.os != 'Windows' && matrix.platform != 'x86_64-linux'
        with:
          ruby-version: '4.0'
          bundler-cache: false
      - run: ruby ext/build_native_per_minor.rb
        if: runner.os != 'Windows' && matrix.platform != 'x86_64-linux'
        shell: bash
      # Restore the JOB ruby + its bundle before rake gem:native —
      # the per-minor loop's last setup-ruby (4.0) left the job
      # without a bundler install (the 1.9.363.0 train: every
      # darwin/Linux leg died on Bundler::GemNotFound).
      - uses: ruby/setup-ruby@master
        if: runner.os != 'Windows'
        with:
          ruby-version: ${{ matrix.ruby-version || '3.3' }}
          bundler-cache: true
      - name: Verify every supported minor has a native bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ext=darwin && case "${{ runner.os }}" in macOS) ext=bundle;; Linux) ext=so;; *) ext=so;; esac
          # ruby#645: the minor list is SUPPORTED_MINORS (the SSOT).
          for m in $(cat SUPPORTED_MINORS | tr "." "_"); do
            f="lib/leptris/xml/native_${m}.${ext}"
            [ -f "$f" ] || { echo "ERROR: missing $f"; exit 1; }
          done
          echo "All $(cat SUPPORTED_MINORS | wc -w | tr -d ' ') per-minor native bundles present"

      - run: bundle exec rake gem:native:${{ matrix.platform }}
        if: matrix.platform != 'x86_64-linux'
        shell: bash

      # #2109 stage 2: packaging assembles the container-built
      # artifacts host-side — gem packaging is glibc-independent.
      # gem:native:<platform> would re-run `rake compile` and rebuild
      # the engine on the ubuntu host (glibc 2.35 → GLIBC_2.34
      # symbols), so the platform task runs directly against the
      # workspace the bullseye containers filled.
      - run: bundle exec rake platform:x86_64-linux gem
        if: matrix.platform == 'x86_64-linux'
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.platform }}
          path: pkg/*.gem

      - name: Upload vendored binaries for the ruby variant
        if: matrix.platform != 'x64-mingw32' && matrix.platform != 'x64-mingw-ucrt' && matrix.platform != 'aarch64-mingw-ucrt'
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: |
            lib/libleptris.*
            lib/libutf8proc.*

  build-musl:
    needs: [bump, pin]
    if: always() && !cancelled() && !failure()
    runs-on: ${{ matrix.os }}
    env:
      BUNDLE_WITHOUT: benchmark
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || needs.pin.outputs.sha }}

      # Musl builds run inside an Alpine container so the vendored
      # library links against musl libc. JS actions cannot run inside
      # Alpine, so checkout/artifact happen on the host and the build
      # runs via `docker run` with the workspace mounted.
      #
      # ruby#645: the per-minor native contract applies to EVERY
      # platform — a single-ruby container ships native_<its-minor>.so
      # only, and Ruby 4.0 on that platform silently degrades to FFI.
      # The per-minor bundles compile in one image per minor (the
      # builder needs only stdlib + a C toolchain, no bundle), then
      # the packaging image assembles the gem and the gate REQUIRES
      # all five before it runs.
      - name: Build per-minor bundles in Alpine containers
        run: |
          set -e
          # ruby#645: the minor list is SUPPORTED_MINORS (the repo
          # SSOT) — never a literal here.
          for minor in $(cat SUPPORTED_MINORS); do
            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              "ruby:${minor}-alpine" sh -c '
                set -eux
                apk add --no-cache build-base bash git make
                git config --global --add safe.directory /work
                ruby ext/build_native_per_minor.rb
              '
          done

      - name: Package and smoke in Alpine container
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e BUNDLE_WITHOUT="${BUNDLE_WITHOUT}" \
            -e target_platform="${TARGET_PLATFORM}" \
            ruby:3.3-alpine sh -c '
              set -eux
              apk add --no-cache build-base bash curl git cmake make ninja gcc g++ linux-headers
              git config --global --add safe.directory /work
              # ruby#645 publication gate: every minor in
              # SUPPORTED_MINORS must have its bundle present before
              # packaging — a missing minor is a silent FFI
              # degradation on that Ruby, never a ship.
              for m in $(cat SUPPORTED_MINORS | tr "." "_"); do
                f="lib/leptris/xml/native_${m}.so"
                [ -f "$f" ] || { echo "ERROR: missing $f (ruby#645 gate)"; exit 1; }
              done
              bundle install --jobs 4 --retry 3
              bundle exec rake gem:native:"'"${TARGET_PLATFORM}"'"
              # Validate the built gem INSIDE the container (both musl
              # rows — aarch64-musl is otherwise built but never run).
              gem install --local pkg/*.gem --no-document
              ruby /work/scripts/gem_smoke.rb
            '

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.platform }}
          path: pkg/*.gem

      - name: Upload vendored binaries for the ruby variant
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: |
            lib/libleptris.*
            lib/libutf8proc.*

  build-arm32:
    # 32-bit ARM (armv7) has no GitHub-hosted runner, and the
    # aarch64 glibc leg is ALSO built here under qemu: a 24.04-arm
    # native build leaked GLIBC_2.38 requirements (glibc 2.39
    # runner), locking out Debian 12 / Ubuntu 22.04 hosts — the
    # bookworm base keeps the floor at 2.36. qemu binfmt
    # emulation, the same shape the sibling project verified as
    # true 32-bit ARM ELF. PGO is OFF for the emulated legs: the
    # two-stage trainer's instrumented build + corpus run cost
    # 10-20x under qemu; the plain single-stage build ships the
    # identical library.
    #
    # The armv7 rows and the qemu POWER/Z rows all went strict at
    # 1.9.208: upstream shipped the ILP32 port (#1174, closed —
    # arm-linux + arm-linux-musl gems published in consecutive
    # releases), ppc64le built clean since the audit nm fix, and
    # the big-endian close-tag bug (#1197) was fixed engine-side in
    # 1.9.206 with both qemu test legs green on main's 1.9.207
    # grid. A red cell here blocks the release again — as it
    # should.
    continue-on-error: ${{ matrix.experimental }}
    needs: bump
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: benchmark
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: aarch64-linux
            # glibc floor: bullseye 2.31, not bookworm 2.36 (#2109)
            image: ruby:3.3-bullseye
            qplatform: linux/arm64
            experimental: false
          - platform: arm-linux
            # glibc floor: bullseye 2.31, not bookworm 2.36 (#2109)
            image: ruby:3.3-bullseye
            qplatform: linux/arm/v7
            experimental: false
          - platform: arm-linux-musl
            image: ruby:3.3-alpine
            qplatform: linux/arm/v7
            experimental: false
          # POWER8+ LE and IBM Z: qemu-built platform gems.
          - platform: ppc64le-linux
            # bullseye's docker-library manifest lacks ppc64le (the
            # 1.9.432 publish died on "no matching manifest") - this
            # leg stays on bookworm (2.36), ungated: the x86_64-linux
            # floor gate (#2109 stage 2) scopes the gnu gate to that
            # platform's artifact. The 2.17 dock floor for the
            # remaining emulated legs is leptris#2109 stage 3.
            image: ruby:3.3-bookworm
            qplatform: linux/ppc64le
            experimental: false
          # s390x ships as MUSL: official ruby images dropped s390x
          # entirely, but Alpine still builds ruby 3.3 for it
          - platform: s390x-linux-musl
            image: ruby:3.3-alpine
            qplatform: linux/s390x
            experimental: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || needs.pin.outputs.sha }}

      - uses: docker/setup-qemu-action@v3

      # ruby#645: per-minor bundles on EVERY qemu leg — the matrix
      # image pins one minor (3.3), whose bundle alone left Ruby 4.0
      # on aarch64/arm/musl/ppc64le/s390x on the FFI surface. One
      # image per minor compiles the per-minor bundle (stdlib +
      # toolchain only, no bundle install), family derived from the
      # matrix image (alpine vs bookworm); the packaging run gates on
      # all five being present.
      - name: Build per-minor bundles in emulated containers
        env:
          MATRIX_IMAGE: ${{ matrix.image }}
        run: |
          set -e
          case "$MATRIX_IMAGE" in
            *alpine*) family=alpine ;;
            *)        family=bookworm ;;
          esac
          mkdir -p .ci-rel
          # The container script is a FILE, not a sh -c string. The
          # inline form died twice on quoting classes: one apostrophe
          # in a comment closed the outer single quote and the rest
          # of the script leaked onto the runner command line, where
          # "cmake" became sh's $0 and the truncated case hit EOF
          # (the 1.9.432.1 trains). A quoted heredoc expands nothing.
          # ruby#645: the minor list is SUPPORTED_MINORS (the repo
          # SSOT) — never a literal here.
          cat > .ci-rel/per_minor.sh <<'EOF'
          set -eux
          case "${CI_IMAGE}" in
            *alpine*)
              apk add --no-cache build-base bash git make cmake curl linux-headers
              ;;
            *)
              rm -rf /var/lib/apt/lists/* \
                && sed -i "/bullseye-security/d" /etc/apt/sources.list 2>/dev/null || true
              apt-get -o Acquire::Check-Valid-Until=false update -qq \
                || apt-get -o Acquire::Check-Valid-Until=false --fix-missing update -qq
              apt-get install -y -qq --no-upgrade build-essential bash git cmake \
                || apt-get install -y -qq --no-upgrade --fix-missing build-essential bash git cmake
              cmake --version | head -1
              ;;
          esac
          git config --global --add safe.directory /work
          ruby ext/build_native_per_minor.rb
          EOF
          for minor in $(cat SUPPORTED_MINORS); do
            docker run --rm \
              --platform '${{ matrix.qplatform }}' \
              -v "$PWD:/work" \
              -w /work \
              -e LEPTRIS_PGO=0 \
              -e CI_IMAGE="ruby:${minor}-${family}" \
              "ruby:${minor}-${family}" sh /work/.ci-rel/per_minor.sh
          done

      - name: Build gem in emulated ARM container
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p .ci-rel
          # Same file-not-string rule as the per-minor step: the
          # inline sh -c form broke on an apostrophe in a comment
          # (closed the outer quote; the truncated case hit EOF with
          # sh $0 = cmake) and on runner-level expansion gymnastics
          # for the rake task argument. The platform rides the
          # target_platform env var instead.
          cat > .ci-rel/package.sh <<'EOF'
          set -eux
          case "${CI_IMAGE}" in
            *alpine*)
              apk add --no-cache build-base bash curl git cmake make linux-headers
              ;;
            *)
              # bullseye went EOL (Aug 2026): deb.debian.org froze
              # main at the last point release while the image
              # carries newer security-pool packages (libc6
              # deb11u14 in the image vs u11 in the main index =
              # "held broken packages" on the first install). Point
              # the suites at archive.debian.org, where both still
              # live. The cmake toolchain comes from the archived
              # backports suite (3.25.1~bpo11+1 - the engine needs
              # 3.20, bullseye ships 3.18). bookworm is current -
              # its stock sources work as-is.
              codename="$(. /etc/os-release && echo "${VERSION_CODENAME:-}")"
              if [ "${codename}" = "bullseye" ]; then
                printf "deb http://archive.debian.org/debian bullseye main\ndeb http://archive.debian.org/debian-security bullseye-security main\n" \
                  > /etc/apt/sources.list
                rm -f /etc/apt/sources.list.d/*.list
              fi
              apt-get -o Acquire::Check-Valid-Until=false update -qq \
                || apt-get -o Acquire::Check-Valid-Until=false --fix-missing update -qq
              apt-get install -y -qq build-essential bash git curl \
                || apt-get install -y -qq --fix-missing build-essential bash git curl
              if [ "${codename}" = "bullseye" ]; then
                echo "deb http://archive.debian.org/debian bullseye-backports main" \
                  > /etc/apt/sources.list.d/bullseye-backports.list
                apt-get -o Acquire::Check-Valid-Until=false update -qq \
                  || apt-get -o Acquire::Check-Valid-Until=false --fix-missing update -qq
                apt-get install -y -qq -t bullseye-backports cmake \
                  || apt-get install -y -qq -t bullseye-backports --fix-missing cmake \
                  || apt-get install -y -qq cmake
              else
                apt-get install -y -qq --no-upgrade cmake \
                  || apt-get install -y -qq --no-upgrade --fix-missing cmake
              fi
              cmake --version | head -1
              ;;
          esac
          git config --global --add safe.directory /work
          # ruby#645 publication gate: every minor in
          # SUPPORTED_MINORS must have its bundle present before
          # packaging.
          for m in $(cat SUPPORTED_MINORS | tr "." "_"); do
            f="lib/leptris/xml/native_${m}.so"
            [ -f "$f" ] || { echo "ERROR: missing $f (ruby#645 gate)"; exit 1; }
          done
          bundle install --jobs 4 --retry 3
          bundle exec rake "gem:native:${target_platform}"
          # Validate the built gem INSIDE the emulation: install it
          # and run the round-trip smoke (parses, queries,
          # serializes, validates). This is what proves the 32-bit
          # shim actually works, not just compiles.
          gem install --local pkg/*.gem --no-document
          ruby /work/scripts/gem_smoke.rb
          EOF
          docker run --rm \
            --platform '${{ matrix.qplatform }}' \
            -v "$PWD:/work" \
            -w /work \
            -e BUNDLE_WITHOUT="${BUNDLE_WITHOUT}" \
            -e LEPTRIS_PGO=0 \
            -e target_platform="${TARGET_PLATFORM}" \
            -e CI_IMAGE='${{ matrix.image }}' \
            '${{ matrix.image }}' sh /work/.ci-rel/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.platform }}
          path: pkg/*.gem

      - name: Upload vendored binaries for the ruby variant
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: |
            lib/libleptris.*
            lib/libutf8proc.*

  build-ruby:
    # Zero-setup TruffleRuby/JRuby (#160): assemble the ruby-platform
    # gem with per-OS vendored binaries gathered from every leg.
    needs: [ bump, pin, build, build-musl, build-arm32 ]
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || needs.pin.outputs.sha }}

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bins
          merge-multiple: false

      - name: Stage vendor tree and build the ruby gem
        run: |
          set -eux
          for d in bins/bin-*; do
            plat="${d#bins/bin-}"
            mkdir -p "lib/leptris/vendor/${plat}"
            cp "${d}"/libleptris.* "${d}"/libutf8proc.* "lib/leptris/vendor/${plat}/" 2>/dev/null || true
          done
          find lib/leptris/vendor -type f
          # The sdist needs vendor-src/ (the engine + utf8proc
          # sources the extconf compiles at install) — only rake
          # compile stages it, and no earlier step in THIS job
          # runs compile. 1.9.201.2 shipped extensions with zero
          # sources because of exactly that. PGO=0: the engine
          # binary this job builds is throwaway (the vendored
          # binaries above are the artifacts users load).
          LEPTRIS_PGO=0 bundle exec rake compile
          # #2109 stage 2: rake compile's vendor-sync (#582) overwrites
          # the x86_64-linux vendored engine with THIS job's host build
          # (ubuntu glibc 2.39) — restore the container-built bullseye
          # binary from the build leg's artifact so the shipped vendor
          # copy keeps the 2.31 floor. Every OTHER platform's vendor
          # copy is untouched by the sync (it keys on RUBY_PLATFORM).
          v=lib/leptris/vendor/x86_64-linux
          if [ -d bins/bin-x86_64-linux ]; then
            cp bins/bin-x86_64-linux/libleptris.so "${v}/libleptris.so"
            cp bins/bin-x86_64-linux/libutf8proc.so.3 "${v}/libutf8proc.so.3"
          fi
          # The gnu glibc floor gate (#2109) is HARD again: the ruby
          # gem's x86_64-linux vendored engine must not bind symbols
          # newer than 2.31 - the pthread-merge trio (pthread_once
          # etc.) binds 2.34 whenever the build host libc is newer,
          # and the gem then LoadErrors at first use on every pre-2.34
          # host.
          max=$(strings "${v}/libleptris.so" | grep -oE 'GLIBC_2\.[0-9]+' | sort -uV | tail -1)
          echo "max glibc symbol version: $max"
          if [ -z "$max" ]; then
            echo "::error::no GLIBC symbol versions found in ${v}/libleptris.so"
            exit 1
          fi
          minor=${max#GLIBC_2.}
          if [ "$minor" -gt 31 ]; then
            echo "::error::the gnu gem binds $max; the floor is 2.31 (leptris-ruby #2109)"
            exit 1
          fi
          echo "gnu floor gate: OK ($max <= GLIBC_2.31)"
          rm -rf pkg
          bundle exec rake platform:any gem

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-any
          path: pkg/*.gem

  publish:
    needs: [ bump, pin, build, build-musl, build-arm32, build-ruby ]
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || needs.pin.outputs.sha }}

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'

      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: pkg
          merge-multiple: true

      # Every variant must ship byte-identical lib/**/*.rb — a skew
      # means one cell packaged from a different source state (the
      # sibling project's #318 class: a mingw-only Ruby/natives
      # mismatch surfaced as NameErrors in host apps).
      - name: Verify Ruby-source parity across platform variants
        run: |
          set -euo pipefail
          rm -rf /tmp/parity && mkdir -p /tmp/parity
          valid=0
          for gem in pkg/*.gem; do
            name=$(basename "$gem" .gem)
            # A .gem's OUTER container is a plain POSIX tar, not
            # gzip (rubygems never gzips it). GNU tar's forced -z
            # ("tar tzf/xzf") rejects it ("not in gzip format") —
            # macOS bsdtar silently tolerates, which is why this
            # only exploded on CI. Auto-detect everywhere on the
            # outer container; only data.tar.gz inside is gzip.
            if ! tar tf "$gem" >/dev/null 2>&1; then
              echo "::warning::$name is not a readable gem archive (partial output of an experimental leg) — skipping parity for it"
              continue
            fi
            d="/tmp/parity/$name"
            mkdir -p "$d"
            tar xf "$gem" -C "$d" data.tar.gz
            tar xf "$d/data.tar.gz" -C "$d"
            find "$d/lib" -name '*.rb' -type f | sed "s|$d/||" | sort > "$d/list.txt"
            valid=$((valid + 1))
          done
          if [ "$valid" -lt 2 ]; then
            echo "::error::fewer than two valid variants to compare"
            exit 1
          fi
          first=$(ls /tmp/parity | head -1)
          ref_list="/tmp/parity/$first/list.txt"
          ref_hashes=$(cd "/tmp/parity/$first" && xargs md5sum < list.txt | sort -k2)
          for d in /tmp/parity/*/; do
            name=$(basename "$d")
            [ "$name" = "$first" ] && continue
            diff -q "$ref_list" "$d/list.txt" >/dev/null || {
              echo "::error::$name ships a different lib/**/*.rb file set than $first"
              exit 1
            }
            hashes=$(cd "$d" && xargs md5sum < list.txt | sort -k2)
            diff -q <(echo "$ref_hashes") <(echo "$hashes") >/dev/null || {
              echo "::error::$name Ruby sources differ from $first (version skew)"
              exit 1
            }
          done
          echo "Ruby sources byte-identical across $(ls /tmp/parity | wc -l | tr -d ' ') variants"

      # ruby#645 publication gate: EVERY linux/darwin platform variant
      # ships the full per-minor native set from SUPPORTED_MINORS (the
      # repo SSOT) — a missing minor is a silent FFI degradation on
      # that Ruby (1.9.426.0 left aarch64-linux/musl/arm with
      # native_3_3 only, locking every Ruby 4.0 Linux host out of the
      # native surface). mingw variants carry their own export-symbol
      # gate in the build job; the ruby-platform gem compiles at
      # install.
      - name: Verify per-minor native completeness across platform variants
        run: |
          set -euo pipefail
          rc=0
          shopt -s nullglob
          for gem in pkg/leptris-*-linux*.gem pkg/leptris-*darwin*.gem; do
            name=$(basename "$gem" .gem)
            case "$gem" in
              *darwin*) ext=bundle ;;
              *)        ext=so ;;
            esac
            rm -rf /tmp/pm && mkdir -p /tmp/pm
            tar xf "$gem" -C /tmp/pm data.tar.gz
            tar xzf /tmp/pm/data.tar.gz -C /tmp/pm
            missing=""
            for m in $(cat SUPPORTED_MINORS | tr "." "_"); do
              [ -f "/tmp/pm/lib/leptris/xml/native_${m}.${ext}" ] || missing="$missing native_${m}.${ext}"
            done
            if [ -n "$missing" ]; then
              echo "::error::$name missing per-minor bundles:$missing (ruby#645)"
              rc=1
            else
              echo "$name: per-minor set complete ($(cat SUPPORTED_MINORS | wc -w | tr -d ' ') minors)"
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::incomplete per-minor sets block publication (ruby#645)"
          fi
          exit $rc

      - name: Configure RubyGems credentials (Trusted Publishing / OIDC)
        uses: rubygems/configure-rubygems-credentials@main

      - name: Publish to rubygems.org
        run: |
          ls -la pkg/
          for gem in pkg/*.gem; do
            echo "Pushing $gem..."
            if ! output=$(gem push -V "$gem" 2>&1); then
              # Re-running a partially-completed release is safe:
              # variants already on rubygems are skipped, any other
              # failure aborts.
              case "$output" in
                *"Repushing of gem versions is not allowed"*)
                  echo "::warning::$gem already published; skipping"
                  ;;
                *)
                  echo "$output"
                  exit 1
                  ;;
              esac
            else
              echo "$output"
            fi
          done
