name: release

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: 'Version to release (e.g. 1.1.1). Leave empty to use current VERSION.'
        type: string
        required: false

# Duplicate dispatches of the same release version must not run
# concurrently: two parallel publishes race on the bump/tag push and
# the artifact assembly (hit in practice during the 1.9.19x train).
# The publish loop is idempotent, so cancelling a superseded run is
# always safe.
concurrency:
  group: 'release-${{ inputs.next_version || github.ref }}'
  cancel-in-progress: true

# contents: write is needed for pushing the version-bump commit + tag.
# id-token: write is required for RubyGems.org Trusted Publishing (OIDC).
permissions:
  contents: write
  id-token: write

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch' && inputs.next_version != ''
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'

      - name: Bump version.rb
        id: bump
        shell: bash
        env:
          NEXT_VERSION: ${{ inputs.next_version }}
        run: |
          set -euo pipefail
          # Accept x.y.z and x.y.z.w (the lockstep scheme
          # {libleptris-semver}.{binding-patch}), or a relative bump
          # (major/minor/patch) computed from the CURRENT version —
          # patch bumps the BINDING segment (the fourth). The guard
          # exists because a non-semver input once produced VERSION
          # = "patch" on main and a junk tag literally named "v".
          INPUT="${NEXT_VERSION}"
          if [[ "$INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            :
          elif [[ "$INPUT" == "major" || "$INPUT" == "minor" || "$INPUT" == "patch" ]]; then
            CURRENT=$(ruby -Ilib -rleptris/version -e 'puts Leptris::VERSION')
            IFS=. read -r MA MI PA QU <<< "$CURRENT"
            QU="${QU:-0}"
            case "$INPUT" in
              major) MA=$((MA + 1)); MI=0; PA=0; QU=0 ;;
              minor) MI=$((MI + 1)); PA=0; QU=0 ;;
              patch) QU=$((QU + 1)) ;;
            esac
            INPUT="${MA}.${MI}.${PA}.${QU}"
          else
            echo "::error::next_version must be x.y.z or major/minor/patch, got '${INPUT}'"
            exit 1
          fi
          echo "Releasing ${INPUT}"
          sed -i "s/VERSION = \".*\"/VERSION = \"${INPUT}\"/" lib/leptris/version.rb
          NEW_VERSION=$(ruby -Ilib -rleptris/version -e 'puts Leptris::VERSION')
          # Emit the output the push step consumes. Without it the
          # tag push received an empty version and created tag "v".
          echo "new-version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/leptris/version.rb
          # Idempotent: re-releasing the current version must not
          # fail on an empty commit.
          if git diff --cached --quiet; then
            echo "No version change; tagging current HEAD."
          else
            git commit -m "Bump leptris to ${NEW_VERSION}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push bump commit + tag
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new-version }}
        run: |
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          git tag "v${NEW_VERSION}" HEAD
          # A failed release run can leave its tag behind while the
          # gems never published; re-dispatching the same version
          # must not die on it (the publish loop is idempotent).
          git push origin "v${NEW_VERSION}" || \
            echo "::warning::tag v${NEW_VERSION} already exists — continuing"

  build:
    needs: bump
    if: always() && !cancelled() && !failure()
    runs-on: ${{ matrix.os }}
    # Release builds never run the benchmark suite; nokogiri has no
    # aarch64-Windows binary gem and its source build fails there.
    env:
      BUNDLE_WITHOUT: benchmark
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: x86_64-linux
          - os: windows-latest
            platform: x64-mingw32
          - os: windows-latest
            platform: x64-mingw-ucrt
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
            ruby-version: '3.4'
          - os: macos-latest
            platform: arm64-darwin
          - os: macos-15-intel
            platform: x86_64-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || github.ref }}

      # #227: Windows native layer as one DLL per Ruby minor. A PE
      # DLL must bind its build Ruby's runtime, so each supported
      # minor compiles its own artifact before packaging. The
      # packaging step's own ruby builds its minor via rake
      # compile, and these steps cover the OTHERS — each version
      # is set up exactly once (re-setup hits an msys64 symlink
      # EEXIST), and a minor unavailable on a runner (3.3 on arm)
      # degrades to the loud FFI fallback for that cell only.
      - uses: ruby/setup-ruby@master
        if: contains(matrix.platform, 'mingw') && (matrix.ruby-version || '3.3') != '3.3'
        with:
          ruby-version: '3.3'
          bundler-cache: false
        continue-on-error: true
      - run: ruby ext/build_windows_native.rb
        if: contains(matrix.platform, 'mingw') && (matrix.ruby-version || '3.3') != '3.3'
        shell: bash
        continue-on-error: true
      - uses: ruby/setup-ruby@master
        if: contains(matrix.platform, 'mingw') && (matrix.ruby-version || '3.3') != '3.4'
        with:
          ruby-version: '3.4'
          bundler-cache: false
        continue-on-error: true
      - run: ruby ext/build_windows_native.rb
        if: contains(matrix.platform, 'mingw') && (matrix.ruby-version || '3.3') != '3.4'
        shell: bash
        continue-on-error: true
      - uses: ruby/setup-ruby@master
        if: contains(matrix.platform, 'mingw') && (matrix.ruby-version || '3.3') != '4.0'
        with:
          ruby-version: '4.0'
          bundler-cache: false
        continue-on-error: true
      - run: ruby ext/build_windows_native.rb
        if: contains(matrix.platform, 'mingw') && (matrix.ruby-version || '3.3') != '4.0'
        shell: bash
        continue-on-error: true
      - name: Verify at least one Windows native DLL built
        if: contains(matrix.platform, 'mingw')
        shell: bash
        run: |
          count=$(ls lib/leptris/xml/native_*.so 2>/dev/null | wc -l)
          if [ "$count" -lt 1 ]; then
            echo "ERROR: no native_<minor>.so built for ${{ matrix.platform }}"
            exit 1
          fi
          echo "Windows native DLLs: $count"

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: ${{ matrix.ruby-version || '3.3' }}
          bundler-cache: true

      - run: bundle exec rake gem:native:${{ matrix.platform }}
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.platform }}
          path: pkg/*.gem

      - name: Upload vendored binaries for the ruby variant
        if: matrix.platform != 'x64-mingw32' && matrix.platform != 'x64-mingw-ucrt' && matrix.platform != 'aarch64-mingw-ucrt'
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: |
            lib/libleptris.*
            lib/libutf8proc.*

  build-musl:
    needs: bump
    if: always() && !cancelled() && !failure()
    runs-on: ${{ matrix.os }}
    env:
      BUNDLE_WITHOUT: benchmark
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || github.ref }}

      # Musl builds run inside an Alpine container so the vendored
      # library links against musl libc. JS actions cannot run inside
      # Alpine, so checkout/artifact happen on the host and the build
      # runs via `docker run` with the workspace mounted.
      - name: Build gem in Alpine container
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e BUNDLE_WITHOUT="${BUNDLE_WITHOUT}" \
            -e target_platform="${TARGET_PLATFORM}" \
            ruby:3.3-alpine sh -c '
              set -eux
              apk add --no-cache build-base bash curl git cmake make ninja gcc g++ linux-headers
              git config --global --add safe.directory /work
              bundle install --jobs 4 --retry 3
              bundle exec rake gem:native:"'"${TARGET_PLATFORM}"'"
              # Validate the built gem INSIDE the container (both musl
              # rows — aarch64-musl is otherwise built but never run).
              gem install --local pkg/*.gem --no-document
              ruby /work/scripts/gem_smoke.rb
            '

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.platform }}
          path: pkg/*.gem

      - name: Upload vendored binaries for the ruby variant
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: |
            lib/libleptris.*
            lib/libutf8proc.*

  build-arm32:
    # 32-bit ARM (armv7) has no GitHub-hosted runner, and the
    # aarch64 glibc leg is ALSO built here under qemu: a 24.04-arm
    # native build leaked GLIBC_2.38 requirements (glibc 2.39
    # runner), locking out Debian 12 / Ubuntu 22.04 hosts — the
    # bookworm base keeps the floor at 2.36. qemu binfmt
    # emulation, the same shape the sibling project verified as
    # true 32-bit ARM ELF. PGO is OFF for the emulated legs: the
    # two-stage trainer's instrumented build + corpus run cost
    # 10-20x under qemu; the plain single-stage build ships the
    # identical library.
    #
    # The armv7 rows and the qemu POWER/Z rows all went strict at
    # 1.9.208: upstream shipped the ILP32 port (#1174, closed —
    # arm-linux + arm-linux-musl gems published in consecutive
    # releases), ppc64le built clean since the audit nm fix, and
    # the big-endian close-tag bug (#1197) was fixed engine-side in
    # 1.9.206 with both qemu test legs green on main's 1.9.207
    # grid. A red cell here blocks the release again — as it
    # should.
    continue-on-error: ${{ matrix.experimental }}
    needs: bump
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: benchmark
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: aarch64-linux
            image: ruby:3.3-bookworm
            qplatform: linux/arm64
            experimental: false
          - platform: arm-linux
            image: ruby:3.3-bookworm
            qplatform: linux/arm/v7
            experimental: false
          - platform: arm-linux-musl
            image: ruby:3.3-alpine
            qplatform: linux/arm/v7
            experimental: false
          # POWER8+ LE and IBM Z: qemu-built platform gems.
          - platform: ppc64le-linux
            image: ruby:3.3-bookworm
            qplatform: linux/ppc64le
            experimental: false
          # s390x ships as MUSL: official ruby images dropped s390x
          # entirely, but Alpine still builds ruby 3.3 for it
          - platform: s390x-linux-musl
            image: ruby:3.3-alpine
            qplatform: linux/s390x
            experimental: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || github.ref }}

      - uses: docker/setup-qemu-action@v3

      - name: Build gem in emulated ARM container
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm \
            --platform '${{ matrix.qplatform }}' \
            -v "$PWD:/work" \
            -w /work \
            -e BUNDLE_WITHOUT="${BUNDLE_WITHOUT}" \
            -e LEPTRIS_PGO=0 \
            -e target_platform="${TARGET_PLATFORM}" \
            '${{ matrix.image }}' sh -c '
              set -eux
              case "${{ matrix.image }}" in
                *alpine*)
                  apk add --no-cache build-base bash curl git cmake make linux-headers
                  ;;
                *)
                  apt-get update -qq
                  apt-get install -y -qq build-essential cmake bash git curl
                  ;;
              esac
              git config --global --add safe.directory /work
              bundle install --jobs 4 --retry 3
              bundle exec rake gem:native:"'"${TARGET_PLATFORM}"'"
              # Validate the built gem INSIDE the emulation: install
              # it and run the round-trip smoke (parses, queries,
              # serializes, validates). This is what proves the
              # 32-bit shim actually works, not just compiles.
              gem install --local pkg/*.gem --no-document
              ruby /work/scripts/gem_smoke.rb
            '

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.platform }}
          path: pkg/*.gem

      - name: Upload vendored binaries for the ruby variant
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: |
            lib/libleptris.*
            lib/libutf8proc.*

  build-ruby:
    # Zero-setup TruffleRuby/JRuby (#160): assemble the ruby-platform
    # gem with per-OS vendored binaries gathered from every leg.
    needs: [ bump, build, build-musl, build-arm32 ]
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || github.ref }}

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bins
          merge-multiple: false

      - name: Stage vendor tree and build the ruby gem
        run: |
          set -eux
          for d in bins/bin-*; do
            plat="${d#bins/bin-}"
            mkdir -p "lib/leptris/vendor/${plat}"
            cp "${d}"/libleptris.* "${d}"/libutf8proc.* "lib/leptris/vendor/${plat}/" 2>/dev/null || true
          done
          find lib/leptris/vendor -type f
          # The sdist needs vendor-src/ (the engine + utf8proc
          # sources the extconf compiles at install) — only rake
          # compile stages it, and no earlier step in THIS job
          # runs compile. 1.9.201.2 shipped extensions with zero
          # sources because of exactly that. PGO=0: the engine
          # binary this job builds is throwaway (the vendored
          # binaries above are the artifacts users load).
          LEPTRIS_PGO=0 bundle exec rake compile
          rm -rf pkg
          bundle exec rake platform:any gem

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-any
          path: pkg/*.gem

  publish:
    needs: [ bump, build, build-musl, build-arm32, build-ruby ]
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || github.ref }}

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'

      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: pkg
          merge-multiple: true

      # Every variant must ship byte-identical lib/**/*.rb — a skew
      # means one cell packaged from a different source state (the
      # sibling project's #318 class: a mingw-only Ruby/natives
      # mismatch surfaced as NameErrors in host apps).
      - name: Verify Ruby-source parity across platform variants
        run: |
          set -euo pipefail
          rm -rf /tmp/parity && mkdir -p /tmp/parity
          valid=0
          for gem in pkg/*.gem; do
            name=$(basename "$gem" .gem)
            # A .gem's OUTER container is a plain POSIX tar, not
            # gzip (rubygems never gzips it). GNU tar's forced -z
            # ("tar tzf/xzf") rejects it ("not in gzip format") —
            # macOS bsdtar silently tolerates, which is why this
            # only exploded on CI. Auto-detect everywhere on the
            # outer container; only data.tar.gz inside is gzip.
            if ! tar tf "$gem" >/dev/null 2>&1; then
              echo "::warning::$name is not a readable gem archive (partial output of an experimental leg) — skipping parity for it"
              continue
            fi
            d="/tmp/parity/$name"
            mkdir -p "$d"
            tar xf "$gem" -C "$d" data.tar.gz
            tar xf "$d/data.tar.gz" -C "$d"
            find "$d/lib" -name '*.rb' -type f | sed "s|$d/||" | sort > "$d/list.txt"
            valid=$((valid + 1))
          done
          if [ "$valid" -lt 2 ]; then
            echo "::error::fewer than two valid variants to compare"
            exit 1
          fi
          first=$(ls /tmp/parity | head -1)
          ref_list="/tmp/parity/$first/list.txt"
          ref_hashes=$(cd "/tmp/parity/$first" && xargs md5sum < list.txt | sort -k2)
          for d in /tmp/parity/*/; do
            name=$(basename "$d")
            [ "$name" = "$first" ] && continue
            diff -q "$ref_list" "$d/list.txt" >/dev/null || {
              echo "::error::$name ships a different lib/**/*.rb file set than $first"
              exit 1
            }
            hashes=$(cd "$d" && xargs md5sum < list.txt | sort -k2)
            diff -q <(echo "$ref_hashes") <(echo "$hashes") >/dev/null || {
              echo "::error::$name Ruby sources differ from $first (version skew)"
              exit 1
            }
          done
          echo "Ruby sources byte-identical across $(ls /tmp/parity | wc -l | tr -d ' ') variants"

      - name: Configure RubyGems credentials (Trusted Publishing / OIDC)
        uses: rubygems/configure-rubygems-credentials@main

      - name: Publish to rubygems.org
        run: |
          ls -la pkg/
          for gem in pkg/*.gem; do
            echo "Pushing $gem..."
            if ! output=$(gem push -V "$gem" 2>&1); then
              # Re-running a partially-completed release is safe:
              # variants already on rubygems are skipped, any other
              # failure aborts.
              case "$output" in
                *"Repushing of gem versions is not allowed"*)
                  echo "::warning::$gem already published; skipping"
                  ;;
                *)
                  echo "$output"
                  exit 1
                  ;;
              esac
            else
              echo "$output"
            fi
          done
